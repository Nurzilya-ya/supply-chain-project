{% extends 'base.html' %}

{% block title %}Новый материал{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card shadow-sm">
            <div class="card-header bg-primary text-white">
                <h4 class="mb-0">Добавление нового материала</h4>
            </div>
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}
                    <div class="row mb-3">
                        <div class="col-md-8">
                            <label class="form-label">Наименование</label>
                            {{ form.name }}
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Код</label>
                            {{ form.code }}
                        </div>
                    </div>
                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label class="form-label">Категория</label>
                            {{ form.category }}
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Единица измерения</label>
                            {{ form.unit }}
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Описание</label>
                        {{ form.description }}
                    </div>
                    <div class="form-check mb-4">
                        {{ form.is_active }}
                        <label class="form-check-label">Активный материал (участвует в заявках)</label>
                    </div>
                    <div class="d-flex justify-content-between">
                        <a href="{% url 'material_list' %}" class="btn btn-secondary">Отмена</a>
                        <button type="submit" class="btn btn-primary">Сохранить материал</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
